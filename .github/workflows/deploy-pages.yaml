name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create firebase-config.js from GitHub secrets (module + global)
        run: |
          cat > firebase-config.js <<'EOF'
          (function(){
            const cfg = {
              apiKey: "${{ secrets.FIREBASE_API_KEY }}",
              authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
              projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
              storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
              messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
              appId: "${{ secrets.FIREBASE_APP_ID }}",
              measurementId: "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
            };
            try { window.__FIREBASE_CONFIG = cfg; } catch(e){}
            export default cfg;
          })();
          EOF

      - name: Verify firebase-config.js exists
        run: |
          echo "Listing file and size for firebase-config.js"
          ls -la firebase-config.js || true
          echo "Size (bytes):" $(wc -c < firebase-config.js) || true

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check published firebase-config.js
        if: always()
        run: |
          echo "Published page URL: ${{ steps.deployment.outputs.page_url }}"
          PUBLISHED_URL="${{ steps.deployment.outputs.page_url }}"
          # Ensure URL ends with a slash
          case "$PUBLISHED_URL" in
            */) ;;
            *) PUBLISHED_URL="$PUBLISHED_URL/" ;;
          esac
          echo "Checking ${PUBLISHED_URL}firebase-config.js"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${PUBLISHED_URL}firebase-config.js" || echo "000")
          echo "HTTP status for firebase-config.js: $STATUS"
