<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Área de clientes de Tethys Tech." />
  <title>Área de Clientes | Tethys Tech</title>
  <link rel="icon" href="images/Favicon 2.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="header-link">
        <img src="images/Tethys Tech.svg" alt="Tethys Tech logo" class="header-logo" />
        <span class="header-text">Tethys Tech</span>
      </a>
      <div class="header-actions">
        <button id="sign-out-btn" class="header-client-area header-sign-out-btn hidden">Cerrar sesión</button>
      </div>
    </div>
  </header>
  <main class="site-main" role="main">
    <section class="section" aria-label="Área de clientes">
      <div class="container">
        <div id="client-area-state" class="client-area-state">
          <div id="auth-section" class="client-card auth-card hidden">
            <div class="auth-switch" role="tablist" aria-label="Seleccionar formulario de autenticación">
              <button type="button" id="show-login-btn" class="auth-switch-button active" aria-selected="true">Iniciar sesión</button>
              <button type="button" id="show-signup-btn" class="auth-switch-button" aria-selected="false">Crear cuenta</button>
            </div>
            <p id="auth-status-message" class="alert-message"></p>
            <form id="login-form" class="auth-form" autocomplete="on">
              <div class="auth-form-header">
                <span class="auth-form-kicker">Área privada</span>
                <h2>Iniciar sesión</h2>
              </div>
              <div class="input-group">
                <label for="login-email">Email</label>
                <input id="login-email" type="email" required autocomplete="email" placeholder="cliente@ejemplo.com" />
              </div>
              <div class="input-group">
                <label for="login-password">Contraseña</label>
                <input id="login-password" type="password" required autocomplete="current-password" placeholder="Contraseña" />
              </div>
              <button type="submit" class="button primary auth-submit-button">Entrar</button>
            </form>

            <form id="signup-form" class="auth-form hidden" autocomplete="on">
              <div class="auth-form-header">
                <span class="auth-form-kicker">Nuevo acceso</span>
                <h2>Crear cuenta</h2>
              </div>
              <div class="input-group signup-email-field">
                <label for="signup-email">Email</label>
                <input id="signup-email" type="email" required autocomplete="email" placeholder="cliente@ejemplo.com" />
              </div>
              <div class="input-group">
                <label for="signup-name">Nombre</label>
                <input id="signup-name" type="text" required autocomplete="name" placeholder="Nombre" />
              </div>
              <div class="input-group">
                <label for="signup-first-surname">Apellido paterno</label>
                <input id="signup-first-surname" type="text" required placeholder="Apellido paterno" />
              </div>
              <div class="input-group">
                <label for="signup-second-surname">Apellido materno</label>
                <input id="signup-second-surname" type="text" required placeholder="Apellido materno" />
              </div>
              <div class="input-group">
                <label for="signup-password">Contraseña</label>
                <input id="signup-password" type="password" required autocomplete="new-password" placeholder="Contraseña" />
              </div>
              <button type="submit" class="button primary auth-submit-button">Registrar cuenta</button>
            </form>
          </div>

          <div id="dashboard-section" class="dashboard-content hidden">
            <div class="dashboard-header">
              <div>
                <p id="welcome-name" class="eyebrow">Mis proyectos</p>
              </div>
              <div class="dashboard-header-actions">
                <button id="toggle-create-project" class="circle-add-button" aria-label="Crear nuevo proyecto">+</button>
              </div>
            </div>
            <hr>
            <div id="admin-note" class="admin-note hidden">
              Tu usuario tiene permisos de administrador. Podrás aprobar o cancelar proyectos desde este panel.
            </div>

            <div id="project-area">
              <div id="create-project-card" class="project-card hidden">
                <div class="project-card-header">
                  <div>
                    <span class="project-card-kicker">Nuevo proyecto</span>
                    <h3>Crear solicitud</h3>
                  </div>
                </div>
                <form id="project-form" class="project-form">
                  <div class="input-group project-name-field">
                    <label for="project-name">Nombre del proyecto</label>
                    <input id="project-name" type="text" required placeholder="Ej. Automatización interna" />
                  </div>
                  <button type="submit" class="button primary project-submit-button">Enviar proyecto</button>
                  <p id="project-status-message" class="alert-message"></p>
                </form>
              </div>

              <div id="projects-list" class="project-list"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer" aria-label="Pie de página">
    <div class="container footer-grid">
      <p>© 2026 Tethys Tech</p>
    </div>
  </footer>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      query,
      where,
      orderBy,
      addDoc,
      getDocs,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    let firebaseConfig;
    let stopInit = false;
    try {
      // First check the file exists to avoid the dynamic-import 404 uncaught error on GitHub Pages
      const head = await fetch('./firebase-config.js', { method: 'HEAD' });
      if (!head.ok) throw new Error('firebase-config.js not found');
      // eslint-disable-next-line import/no-unresolved
      firebaseConfig = (await import('./firebase-config.js')).default;
    } catch (e) {
      console.warn('Initial import failed for firebase-config.js, will try to load as module tag. Error:', e);
      document.getElementById('auth-status-message').textContent = 'Falta firebase-config.js — intentando carga alternativa...';
      // Try to load the file as a module script (this will execute and may set window.__FIREBASE_CONFIG)
      try {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.type = 'module';
          script.src = './firebase-config.js';
          script.onload = () => resolve();
          script.onerror = (err) => reject(err);
          document.head.appendChild(script);
        });
        // If the module sets the global, use it
        if (window.__FIREBASE_CONFIG) {
          firebaseConfig = window.__FIREBASE_CONFIG;
        } else {
          console.warn('Module loaded but window.__FIREBASE_CONFIG not set.');
        }
      } catch (loadErr) {
        console.error('Alternative load failed:', loadErr);
        const authSectionEl = document.getElementById('auth-section');
        if (authSectionEl) {
          authSectionEl.classList.remove('hidden');
          authSectionEl.hidden = false;
        }
        stopInit = true;
      }
    }

    if (!stopInit) {

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const authSection = document.getElementById("auth-section");
    const dashboardSection = document.getElementById("dashboard-section");
    const welcomeName = document.getElementById("welcome-name");
    const adminNote = document.getElementById("admin-note");
    const projectsList = document.getElementById("projects-list");
    const projectForm = document.getElementById("project-form");
    const projectStatusMessage = document.getElementById("project-status-message");
    const authStatusMessage = document.getElementById("auth-status-message");

    const signOutBtn = document.getElementById("sign-out-btn");
    const toggleCreateProjectBtn = document.getElementById("toggle-create-project");
    const createProjectCard = document.getElementById("create-project-card");
    const loginForm = document.getElementById("login-form");
    const signupForm = document.getElementById("signup-form");
    const showLoginBtn = document.getElementById("show-login-btn");
    const showSignupBtn = document.getElementById("show-signup-btn");
    const pageBody = document.body;

    const userState = {
      currentUser: null,
      isAdmin: false
    };

    const projectStatuses = ["Solicitado", "Aprobado", "Cancelado"];

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeProjectStatus(status) {
      return projectStatuses.includes(status) ? status : "Solicitado";
    }

    function showSection(section) {
      authSection.classList.toggle("hidden", section !== "auth");
      authSection.hidden = section !== "auth";
      dashboardSection.classList.toggle("hidden", section !== "dashboard");
      dashboardSection.hidden = section !== "dashboard";
      pageBody.classList.toggle("dashboard-visible", section === "dashboard");
      signOutBtn.classList.toggle("hidden", section !== "dashboard");
      signOutBtn.hidden = section !== "dashboard";
    }

    function showAlert(message, isError = true, target = "project") {
      const element = target === "auth" ? authStatusMessage : projectStatusMessage;
      element.textContent = message;
      element.classList.toggle("success-message", !isError);
      element.classList.toggle("alert-message", isError);
    }

    function clearAlert() {
      projectStatusMessage.textContent = "";
      authStatusMessage.textContent = "";
    }

    function switchAuthForm(form) {
      const isLogin = form === "login";
      loginForm.classList.toggle("hidden", !isLogin);
      signupForm.classList.toggle("hidden", isLogin);
      showLoginBtn.classList.toggle("active", isLogin);
      showSignupBtn.classList.toggle("active", !isLogin);
      showLoginBtn.setAttribute("aria-selected", isLogin.toString());
      showSignupBtn.setAttribute("aria-selected", (!isLogin).toString());
      clearAlert();
    }

    showLoginBtn.addEventListener("click", () => switchAuthForm("login"));
    showSignupBtn.addEventListener("click", () => switchAuthForm("signup"));
    toggleCreateProjectBtn.addEventListener("click", () => {
      const isHidden = createProjectCard.classList.toggle("hidden");
      toggleCreateProjectBtn.setAttribute("aria-pressed", String(!isHidden));
      toggleCreateProjectBtn.setAttribute(
        "aria-label",
        isHidden ? "Mostrar formulario de nuevo proyecto" : "Ocultar formulario de nuevo proyecto"
      );
      toggleCreateProjectBtn.textContent = "+";
    });

    async function ensureUserProfile(user, profileData = {}) {
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);
      if (!userSnap.exists()) {
        const profile = {
          role: "client",
          email: user.email,
          name: profileData.name || "",
          firstSurname: profileData.firstSurname || "",
          secondSurname: profileData.secondSurname || ""
        };
        await setDoc(userRef, profile);
        return profile;
      }

      const existingProfile = userSnap.data();
      const updatedProfile = {
        ...existingProfile,
        ...(profileData.name ? { name: profileData.name } : {}),
        ...(profileData.firstSurname ? { firstSurname: profileData.firstSurname } : {}),
        ...(profileData.secondSurname ? { secondSurname: profileData.secondSurname } : {})
      };

      if (profileData.name || profileData.firstSurname || profileData.secondSurname) {
        await updateDoc(userRef, updatedProfile);
      }

      return updatedProfile;
    }

    const clientProfileCache = new Map();

    async function fetchClientFullName(clienteId) {
      if (!clienteId) return "Cliente desconocido";
      if (clientProfileCache.has(clienteId)) {
        return clientProfileCache.get(clienteId);
      }

      try {
        const clientRef = doc(db, "users", clienteId);
        const clientSnap = await getDoc(clientRef);
        if (!clientSnap.exists()) {
          clientProfileCache.set(clienteId, "Cliente desconocido");
          return "Cliente desconocido";
        }

        const clientData = clientSnap.data();
        const fullName = [clientData.name, clientData.firstSurname, clientData.secondSurname].filter(Boolean).join(" ");
        const label = fullName || "Cliente desconocido";
        clientProfileCache.set(clienteId, label);
        return label;
      } catch (error) {
        console.error("Error cargando perfil del cliente:", error);
        clientProfileCache.set(clienteId, "Cliente desconocido");
        return "Cliente desconocido";
      }
    }

    function renderProjectItem(project, projectId) {
      const container = document.createElement("article");
      container.className = "project-item";

      const projectName = escapeHtml(project.nombre || "Proyecto sin nombre");
      const status = normalizeProjectStatus(project.estado);
      const clientFullName = escapeHtml(project.clienteFullName || "Cliente desconocido");

      const statusBadge = `<span class="status-pill status-${status.toLowerCase()}">${status}</span>`;

      let stateControl = statusBadge;
      if (userState.isAdmin) {
        stateControl = `
          <div class="status-action-group" aria-label="Cambiar estado del proyecto">
            ${projectStatuses.map((statusOption) => `
              <button
                type="button"
                class="status-pill status-action status-${statusOption.toLowerCase()}${status === statusOption ? " active" : ""}"
                data-project-id="${projectId}"
                data-status="${statusOption}"
                aria-pressed="${status === statusOption}"
              >
                ${statusOption}
              </button>
            `).join("")}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="project-item-header">
          <div>
            <h3>${projectName}</h3>
            <p class="project-username">Administrador: ${clientFullName}</p>
          </div>
          <div class="project-item-status">
            ${stateControl}
          </div>
        </div>
      `;

      if (userState.isAdmin) {
        const statusButtons = container.querySelectorAll(".status-action");
        statusButtons.forEach((button) => {
          button.addEventListener("click", async (event) => {
            const newStatus = event.currentTarget.dataset.status;
            if (!newStatus || newStatus === status) return;
            await updateProjectStatus(projectId, newStatus);
          });
        });
      }

      return container;
    }

    async function loadProjects() {
      clearAlert();
      projectsList.innerHTML = "";
      const projectsRef = collection(db, "proyectos");
      let projectsQuery;
      if (userState.isAdmin) {
        projectsQuery = query(projectsRef, orderBy("fechaCreacion", "desc"));
      } else {
        projectsQuery = query(projectsRef, where("clienteId", "==", userState.currentUser.uid));
      }

      const snapshot = await getDocs(projectsQuery);
      const projects = [];

      snapshot.forEach((docItem) => {
        projects.push({ id: docItem.id, data: docItem.data() });
      });

      const enrichedProjects = await Promise.all(
        projects.map(async (projectItem) => ({
          id: projectItem.id,
          data: {
            ...projectItem.data,
            clienteFullName: await fetchClientFullName(projectItem.data.clienteId)
          }
        }))
      );

      if (enrichedProjects.length === 0) {
        const message = document.createElement("p");
        message.textContent = userState.isAdmin
          ? "No hay proyectos en la base de datos."
          : "Aún no has creado ningún proyecto.";
        projectsList.appendChild(message);
        return;
      }

      if (!userState.isAdmin) {
        enrichedProjects.sort((a, b) => {
          const aTime = a.data.fechaCreacion?.toMillis ? a.data.fechaCreacion.toMillis() : 0;
          const bTime = b.data.fechaCreacion?.toMillis ? b.data.fechaCreacion.toMillis() : 0;
          return bTime - aTime;
        });
      }

      enrichedProjects.forEach((projectItem) => {
        projectsList.appendChild(renderProjectItem(projectItem.data, projectItem.id));
      });
    }

    async function updateProjectStatus(projectId, newStatus) {
      try {
        await updateDoc(doc(db, "proyectos", projectId), {
          estado: newStatus
        });
        showAlert(`Estado actualizado a ${newStatus}.`, false);
        await loadProjects();
      } catch (error) {
        showAlert("No se pudo actualizar el estado. Revisa permisos y conexión.");
        console.error(error);
      }
    }

    async function createProject(event) {
      event.preventDefault();
      clearAlert();

      const name = document.getElementById("project-name").value.trim();

      if (!name) {
        showAlert("El nombre del proyecto es obligatorio.");
        return;
      }

      const uid = userState.currentUser?.uid;
      if (!uid) {
        showAlert("No se encontró usuario activo. Inicia sesión de nuevo.");
        return;
      }

      const docData = {
        clienteId: uid,
        nombre: name,
        estado: "Solicitado",
        fechaCreacion: new Date()
      };

      try {
        console.info('Auth currentUser (pre-create):', auth.currentUser);
        if (!auth.currentUser) {
          showAlert('Usuario no autenticado en el cliente — vuelve a iniciar sesión.');
          return;
        }
        try {
          const token = await auth.currentUser.getIdToken();
          console.info('ID token length:', token?.length);
        } catch (tErr) {
          console.warn('No se pudo obtener token ID del usuario:', tErr);
        }
        // log project id from config if present
        try {
          console.info('Firebase projectId:', firebaseConfig?.projectId || '(no definido)');
        } catch (cfgErr) {
          console.warn('No se pudo leer firebaseConfig:', cfgErr);
        }

        await addDoc(collection(db, "proyectos"), docData);
        showAlert("Proyecto creado correctamente.", false);
        projectForm.reset();
        await loadProjects();
      } catch (error) {
        const code = error?.code || error?.message || '';
        showAlert(`No se pudo crear el proyecto. ${code}`);
        console.error("Create project error:", error);
      }
    }

    async function startDashboard(user) {
      userState.currentUser = user;
      const profile = await ensureUserProfile(user);
      const isAdmin = profile.role === "admin";
      userState.isAdmin = isAdmin;

      const fullName = [profile.name, profile.firstSurname, profile.secondSurname].filter(Boolean).join(" ");
      welcomeName.textContent = isAdmin ? "Panel de administrador" : fullName || "Mis proyectos";
      adminNote.classList.toggle("hidden", !isAdmin);
      showSection("dashboard");
      await loadProjects();
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearAlert();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        const message = error?.message || "Error al iniciar sesión. Verifica email y contraseña.";
        showAlert(message, true, "auth");
        console.error("Firebase login error:", error);
      }
    });

    signupForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearAlert();
      const name = document.getElementById("signup-name").value.trim();
      const firstSurname = document.getElementById("signup-first-surname").value.trim();
      const secondSurname = document.getElementById("signup-second-surname").value.trim();
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value;
      try {
        const result = await createUserWithEmailAndPassword(auth, email, password);
        await ensureUserProfile(result.user, { name, firstSurname, secondSurname });
      } catch (error) {
        const message = error?.message || "No se pudo crear la cuenta. Verifica los datos e intenta de nuevo.";
        showAlert(message, true, "auth");
        console.error("Firebase signup error:", error);
      }
    });

    signOutBtn.addEventListener("click", async () => {
      await signOut(auth);
      showSection("auth");
    });

    projectForm.addEventListener("submit", createProject);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        await startDashboard(user);
      } else {
        showSection("auth");
      }
    });
    }
  </script>
</body>
</html>
